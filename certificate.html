<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSCICC | Certificate</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body class="h-full bg-gray-100">

  <div class="max-w-3xl mx-auto px-5 py-8 text-center">

    <div id="cert-loading" class="py-20">
      <div class="animate-spin h-12 w-12 border-4 border-green-700 border-t-transparent rounded-full mx-auto"></div>
      <p class="text-gray-500 mt-4">সার্টিফিকেট তৈরি হচ্ছে...</p>
    </div>

    <div id="cert-error" class="hidden py-20">
      <div class="text-6xl mb-4">😔</div>
      <h2 class="text-xl font-bold text-gray-800">সার্টিফিকেট দেখানো যাচ্ছে না</h2>
      <p id="cert-error-msg" class="text-red-500 text-sm mt-2"></p>
      <a href="index.html" class="inline-block mt-6 bg-green-700 text-white px-6 py-3 rounded-lg font-bold">🏠 হোমপেজে যান</a>
    </div>

    <div id="cert-content" class="hidden">
      <canvas id="cert-canvas" style="width:100%;height:auto;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.15);"></canvas>

      <div class="mt-6 flex flex-col sm:flex-row gap-3 justify-center">
        <button onclick="downloadCertificate()" class="bg-green-700 text-white font-bold px-8 py-3 rounded-lg hover:bg-green-600 shadow-lg">⬇️ ডাউনলোড করুন (PNG)</button>
        <a href="verify-certificate.html" class="bg-white border-2 border-green-700 text-green-700 font-bold px-8 py-3 rounded-lg hover:bg-green-50">✅ যাচাই করুন</a>
      </div>
      <p class="text-gray-400 text-xs mt-4">Certificate ID: <span id="cert-id-text" class="font-mono"></span></p>
    </div>

  </div>

  <script src="firebase-config.js"></script>
  <script>
    var urlParams = new URLSearchParams(window.location.search);
    var certId = urlParams.get('id');
    var certData = null;
    var certLoadingTimer = null;

    if (!certId) {
      showCertError('URL-এ কোনো Certificate ID পাওয়া যায়নি।');
    } else {
      certLoadingTimer = setTimeout(function() {
        showCertError('লোড হতে অনেক সময় লাগছে — ইন্টারনেট সংযোগ চেক করে আবার চেষ্টা করুন।');
      }, 12000);

      db.collection('certificates').doc(certId).get().then(function(doc) {
        if (!doc.exists) { showCertError('এই Certificate ID-তে কোনো সার্টিফিকেট খুঁজে পাওয়া যায়নি।'); return; }
        certData = doc.data();
        document.title = 'Certificate - ' + (certData.recipientName || '') + ' | GSCICC';

        if (!certData.templateId) { showCertError('এই সার্টিফিকেটের কোনো টেমপ্লেট যুক্ত নেই।'); return; }

        db.collection('certificate_templates').doc(certData.templateId).get().then(function(tDoc) {
          if (!tDoc.exists) { showCertError('টেমপ্লেটটি খুঁজে পাওয়া যায়নি (হয়তো মুছে ফেলা হয়েছে)।'); return; }
          renderCertificate(tDoc.data());
        }).catch(function(err) {
          showCertError('টেমপ্লেট লোড এরর: ' + err.message);
        });
      }).catch(function(err) {
        showCertError('Firestore এরর: ' + err.message);
      });
    }

    function showCertError(msg) {
      if (certLoadingTimer) { clearTimeout(certLoadingTimer); certLoadingTimer = null; }
      document.getElementById('cert-loading').classList.add('hidden');
      document.getElementById('cert-error').classList.remove('hidden');
      document.getElementById('cert-error-msg').textContent = msg || '';
    }

    function renderCertificate(templateData) {
      if (!templateData.backgroundImage) {
        showCertError('এই টেমপ্লেটে কোনো ব্যাকগ্রাউন্ড ছবি নেই।');
        return;
      }

      var img = new Image();
      img.crossOrigin = 'anonymous';

      img.onload = function() {
        try {
          var canvas = document.getElementById('cert-canvas');
          var ctx = canvas.getContext('2d');
          var W = img.naturalWidth || 1200;
          var H = img.naturalHeight || 850;
          canvas.width = W;
          canvas.height = H;

          ctx.drawImage(img, 0, 0, W, H);

          // Draw recipient name on top
          var nameYPercent = templateData.nameY != null ? templateData.nameY : 55;
          var fontSize = templateData.fontSize || Math.round(W * 0.05);
          var color = templateData.accentColor || '#16a34a';
          var y = (H * nameYPercent) / 100;

          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = color;
          ctx.font = '700 ' + fontSize + 'px "Noto Serif Bengali", "Poppins", sans-serif';
          ctx.fillText(certData.recipientName || '', W / 2, y);

          finishRender();
        } catch (err) {
          showCertError('আঁকতে সমস্যা হয়েছে: ' + err.message);
        }
      };

      img.onerror = function() {
        showCertError('ব্যাকগ্রাউন্ড ছবিটি লোড করা যায়নি। ImgBB লিংকটি সঠিক আছে কিনা চেক করুন।');
      };

      img.src = templateData.backgroundImage;
    }

    function finishRender() {
      if (certLoadingTimer) { clearTimeout(certLoadingTimer); certLoadingTimer = null; }
      document.getElementById('cert-loading').classList.add('hidden');
      document.getElementById('cert-content').classList.remove('hidden');
      document.getElementById('cert-id-text').textContent = certId;
    }

    function downloadCertificate() {
      var canvas = document.getElementById('cert-canvas');
      var link = document.createElement('a');
      link.download = 'GSCICC-Certificate-' + (certData.recipientName || 'certificate').replace(/\s+/g, '_') + '.png';
      try {
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (err) {
        alert('❌ ডাউনলোড করতে সমস্যা হয়েছে (সম্ভবত ছবির CORS সমস্যা): ' + err.message);
      }
    }
  </script>
</body>
</html>
