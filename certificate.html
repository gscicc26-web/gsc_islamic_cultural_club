<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSCICC | Certificate</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Serif+Bengali:wght@400;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body class="h-full bg-gray-100">

  <div class="max-w-3xl mx-auto px-5 py-8 text-center">

    <div id="cert-loading" class="py-20">
      <div class="animate-spin h-12 w-12 border-4 border-green-700 border-t-transparent rounded-full mx-auto"></div>
      <p class="text-gray-500 mt-4">সার্টিফিকেট তৈরি হচ্ছে...</p>
    </div>

    <div id="cert-error" class="hidden py-20">
      <div class="text-6xl mb-4">😔</div>
      <h2 class="text-xl font-bold text-gray-800">সার্টিফিকেট খুঁজে পাওয়া যায়নি</h2>
      <a href="index.html" class="inline-block mt-6 bg-green-700 text-white px-6 py-3 rounded-lg font-bold">🏠 হোমপেজে যান</a>
    </div>

    <div id="cert-content" class="hidden">
      <canvas id="cert-canvas" width="1200" height="850" style="width:100%;height:auto;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.15);"></canvas>

      <div class="mt-6 flex flex-col sm:flex-row gap-3 justify-center">
        <button onclick="downloadCertificate()" class="bg-green-700 text-white font-bold px-8 py-3 rounded-lg hover:bg-green-600 shadow-lg">⬇️ ডাউনলোড করুন (PNG)</button>
        <a href="verify-certificate.html" class="bg-white border-2 border-green-700 text-green-700 font-bold px-8 py-3 rounded-lg hover:bg-green-50">✅ যাচাই করুন</a>
      </div>
      <p class="text-gray-400 text-xs mt-4">Certificate ID: <span id="cert-id-text" class="font-mono"></span></p>
    </div>

  </div>

  <script src="firebase-config.js"></script>
  <script>
    var urlParams = new URLSearchParams(window.location.search);
    var certId = urlParams.get('id');
    var certData = null;
    var templateData = null;
    var certLoadingTimer = null;

    if (!certId) {
      showCertError('URL-এ কোনো Certificate ID পাওয়া যায়নি।');
    } else {
      certLoadingTimer = setTimeout(function() {
        showCertError('লোড হতে অনেক সময় লাগছে — সম্ভবত ইন্টারনেট সমস্যা অথবা Firestore থেকে সাড়া পাওয়া যাচ্ছে না।');
      }, 12000);

      db.collection('certificates').doc(certId).get().then(function(doc) {
        if (!doc.exists) { showCertError('এই Certificate ID-তে কোনো সার্টিফিকেট খুঁজে পাওয়া যায়নি।'); return; }
        certData = doc.data();
        document.title = 'Certificate - ' + (certData.recipientName || '') + ' | GSCICC';

        if (certData.templateId) {
          return db.collection('certificate_templates').doc(certData.templateId).get().then(function(tDoc) {
            templateData = tDoc.exists ? tDoc.data() : defaultTemplate();
            renderCertificate();
          });
        } else {
          templateData = defaultTemplate();
          renderCertificate();
        }
      }).catch(function(err) {
        showCertError('Firestore এরর: ' + err.message);
      });
    }

    function defaultTemplate() {
      return {
        titleText: 'Certificate of Achievement',
        subtitleText: 'এই সার্টিফিকেট প্রদান করা হলো',
        bodyTemplate: '{{name}} সফলভাবে {{event}} সম্পন্ন করেছেন{{score}}।',
        accentColor: '#16a34a',
        backgroundImage: ''
      };
    }

    function showCertError(msg) {
      if (certLoadingTimer) { clearTimeout(certLoadingTimer); certLoadingTimer = null; }
      document.getElementById('cert-loading').classList.add('hidden');
      document.getElementById('cert-error').classList.remove('hidden');
      if (msg) {
        var p = document.createElement('p');
        p.className = 'text-red-500 text-sm mt-2';
        p.textContent = msg;
        document.getElementById('cert-error').appendChild(p);
      }
    }

    function renderCertificate() {
      try {
        renderCertificateInner();
      } catch (err) {
        showCertError('সার্টিফিকেট আঁকতে সমস্যা হয়েছে: ' + err.message);
      }
    }

    function renderCertificateInner() {
      var canvas = document.getElementById('cert-canvas');
      var ctx = canvas.getContext('2d');
      var W = canvas.width, H = canvas.height;
      var accent = templateData.accentColor || '#16a34a';

      function drawAll() {
        // Background
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, W, H);

        function drawFrameAndText() {
          // Outer border
          ctx.strokeStyle = accent;
          ctx.lineWidth = 10;
          ctx.strokeRect(20, 20, W - 40, H - 40);
          ctx.strokeStyle = '#fbbf24';
          ctx.lineWidth = 3;
          ctx.strokeRect(36, 36, W - 72, H - 72);

          // Header title
          ctx.textAlign = 'center';
          ctx.fillStyle = accent;
          ctx.font = '800 34px Poppins, sans-serif';
          ctx.fillText('GOVT. SCIENCE COLLEGE ISLAMIC CULTURAL CLUB', W / 2, 110);

          ctx.fillStyle = '#1f2937';
          ctx.font = '800 56px "Playfair Display", serif';
          ctx.fillText(templateData.titleText || 'Certificate of Achievement', W / 2, 190);

          ctx.fillStyle = '#6b7280';
          ctx.font = '400 22px "Noto Serif Bengali", serif';
          ctx.fillText(templateData.subtitleText || '', W / 2, 230);

          // Recipient name
          ctx.fillStyle = accent;
          ctx.font = '700 52px "Noto Serif Bengali", serif';
          ctx.fillText(certData.recipientName || '', W / 2, 340);

          // Underline under name
          var nameWidth = ctx.measureText(certData.recipientName || '').width;
          ctx.strokeStyle = '#fbbf24';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(W / 2 - Math.min(nameWidth / 2 + 30, 400), 360);
          ctx.lineTo(W / 2 + Math.min(nameWidth / 2 + 30, 400), 360);
          ctx.stroke();

          // Body text (wrap)
          var scoreText = certData.scoreText ? ' (স্কোর: ' + certData.scoreText + ')' : '';
          var body = (templateData.bodyTemplate || '{{name}} সফলভাবে {{event}} সম্পন্ন করেছেন{{score}}।')
            .replace(/{{name}}/g, certData.recipientName || '')
            .replace(/{{event}}/g, certData.eventName || '')
            .replace(/{{score}}/g, scoreText);

          ctx.fillStyle = '#374151';
          ctx.font = '400 26px "Noto Serif Bengali", serif';
          wrapText(ctx, body, W / 2, 430, W - 300, 38);

          // Date
          var dateStr = certData.issuedAt ? new Date(certData.issuedAt).toLocaleDateString('bn-BD', { year: 'numeric', month: 'long', day: 'numeric' }) : '';
          ctx.fillStyle = '#6b7280';
          ctx.font = '400 20px Poppins, sans-serif';
          ctx.fillText('তারিখ: ' + dateStr, W / 2, 560);

          // Signature lines
          ctx.strokeStyle = '#9ca3af';
          ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(180, 720); ctx.lineTo(430, 720); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(W - 430, 720); ctx.lineTo(W - 180, 720); ctx.stroke();
          ctx.font = '600 18px Poppins, sans-serif';
          ctx.fillStyle = '#374151';
          ctx.fillText('সভাপতি, GSCICC', 305, 745);
          ctx.fillText('সাধারণ সম্পাদক, GSCICC', W - 305, 745);

          // Cert ID footer
          ctx.font = '400 14px monospace';
          ctx.fillStyle = '#9ca3af';
          ctx.fillText('Certificate ID: ' + certId, W / 2, H - 45);
        }

        if (templateData.backgroundImage) {
          var img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = function() {
            try {
              ctx.globalAlpha = 1;
              ctx.drawImage(img, 0, 0, W, H);
              drawFrameAndText();
            } catch (e) {
              // ignore drawing errors from the background image, still show the frame/text
              drawFrameAndText();
            }
            finishRender();
          };
          img.onerror = function() { drawFrameAndText(); finishRender(); };
          img.src = templateData.backgroundImage;
        } else {
          drawFrameAndText();
          finishRender();
        }
      }

      function finishRender() {
        if (certLoadingTimer) { clearTimeout(certLoadingTimer); certLoadingTimer = null; }
        document.getElementById('cert-loading').classList.add('hidden');
        document.getElementById('cert-content').classList.remove('hidden');
        document.getElementById('cert-id-text').textContent = certId;
      }

      drawAll();
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      var words = text.split(' ');
      var line = '';
      var lines = [];
      for (var i = 0; i < words.length; i++) {
        var testLine = line + words[i] + ' ';
        if (ctx.measureText(testLine).width > maxWidth && line !== '') {
          lines.push(line);
          line = words[i] + ' ';
        } else {
          line = testLine;
        }
      }
      lines.push(line);
      var startY = y - ((lines.length - 1) * lineHeight) / 2;
      lines.forEach(function(l, i) {
        ctx.fillText(l.trim(), x, startY + i * lineHeight);
      });
    }

    function downloadCertificate() {
      var canvas = document.getElementById('cert-canvas');
      var link = document.createElement('a');
      link.download = 'GSCICC-Certificate-' + (certData.recipientName || 'certificate').replace(/\s+/g, '_') + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
